server {
    listen 80;
    server_name _;

    # Root of the Vite production build
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (BrowserRouter):
    # fall back to index.html for unknown paths so direct navigation
    # and refreshes on /about, /services, /projects, /contact work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets -> cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static root files (favicon.svg, decorative SVGs)
    location ~* \.(svg|ico|png|jpg|jpeg|webp|gif|css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Reasonable security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    # Hide Nginx version
    server_tokens off;
}
